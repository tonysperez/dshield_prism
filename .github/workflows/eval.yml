name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clustering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The eval is pure-function: it reads eval/sessions-v1.unlabeled.jsonl
      # + eval/labels-v1.yaml from HEAD and re-runs the production
      # clustering math (L2-normalize + scalar augment + HDBSCAN) on the
      # pinned eval set. No ES connection needed.
      - name: Install deps
        run: pip install -e .[cluster]
      - name: Run operational gate against baseline
        run: |
          python scripts/eval_operational.py \
            --baseline eval/baseline-operational.json \
            --no-json
        # THE gate (quality-metrics Slice A). Grades the operator jobs on the
        # committed eval geometry: assignment macro-F1 + per-label accuracy, novel
        # precision/recall + false-familiar at the shipped tau via a whole-label
        # holdout, minted-playbook purity + distinct count. Thresholds are variance-
        # justified (bootstrap-CI half-width; per-label = hard floor), not a flat
        # drop. Deterministic, no ES. Re-base via `eval_operational.py
        # --write-baseline` after an intentional change (inspect the printed
        # novelty degeneracy line before committing).
      - name: Run clustering eval (DIAGNOSTIC — not gating)
        run: |
          python scripts/eval_clustering.py \
            --baseline eval/baseline.json \
            --no-json
        # Post-Slice-A the partition metrics (ARI/NMI/homogeneity/completeness/
        # v_measure) are a coarse geometry sanity check only — off the shipped
        # nearest-prototype assign path — and no longer fail a build (exits 0).
        # The novel-pool HDBSCAN small-cluster axis still prints here.
      - name: Run assignment eval (DIAGNOSTIC — not gating)
        run: |
          python scripts/eval_assignment.py \
            --baseline eval/baseline-assignment.json \
            --no-json
        # Post-Slice-A this prints accuracy / macro-F1 / mean_auc_novel for
        # visibility but never fails a build; the assignment + novelty numbers
        # gate in eval_operational.py. mean_auc_novel is threshold-free (the
        # pipeline ships one fixed cosine point, not an AUC).
      - name: Run prod-scale assignment eval (real anchors) + gate
        run: |
          python scripts/eval_assignment_prod.py \
            --baseline eval/baseline-assignment-prod.json \
            --no-json
        # Scores the analyst labels against the REAL anchor library (a PUBLIC-only
        # snapshot the operator captures + commits via capture_anchor_snapshot.py).
        # Gracefully SKIPS (exit 0) until eval/anchor-snapshot-v1.jsonl.gz exists, so this
        # step is a harmless no-op on an untagged corpus and activates once the snapshot
        # + baseline are committed. Re-base via `eval_assignment_prod.py --write-baseline`.

  production-scale-gate:
    # E6.2: production-scale eval. The eval-isolated gate above scores
    # 108 sessions in vacuum; production HDBSCAN runs on ~4000+. The
    # E4 postmortem showed a metric win at eval scale can regress at
    # production scale, so any change to the clustering pipeline must
    # clear the production-scale floor too.
    #
    # Scoped via dorny/paths-filter: only runs when a PR touches the
    # clustering math, the cowrie source, production config, the
    # rollup ES mapping, or the snapshot/baseline files themselves.
    # Pushes to main always run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            touched:
              - 'src/enrich/clustering.py'
              - 'src/enrich/sources/cowrie/**'
              - 'config/default.yaml'
              - 'setup/es-mappings/cowrie/sessions.json'
              - 'scripts/eval_production_scale.py'
              - 'eval/production-snapshot-v1.jsonl.gz'
              - 'eval/baseline-prod-scale.json'
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        name: Install deps
        run: pip install -e .[cluster]
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        name: Run production-scale eval against snapshot + baseline
        # Reads eval/production-snapshot-v1.jsonl.gz (committed, ~23 MB
        # gzipped, refreshed quarterly via scripts/refresh_production_snapshot.py)
        # and clusters all rollups offline through the full session pipeline —
        # HDBSCAN + noise rescue + cluster→playbook merge (merge on by default;
        # --no-merge reproduces the pre-merge numbers). Scores the eval-labeled
        # subset against eval/baseline-prod-scale.json. Exits non-zero on: any
        # metric > tolerance below baseline, any label whose cluster
        # count grew by more than +1, or the snapshot exceeding the 180d
        # hard-fail age. Re-base via --write-baseline after an intentional change.
        run: |
          python scripts/eval_production_scale.py \
            --snapshot eval/production-snapshot-v1.jsonl.gz \
            --baseline eval/baseline-prod-scale.json \
            --no-json

  command-scale-gate:
    # F1b: command-layer clustering regression gate. The session layers have
    # an analyst-labeled eval set; the command layer doesn't, so this gate is
    # self-consistency only — it re-runs the command clustering (HDBSCAN +
    # noise rescue) offline against a committed command snapshot and guards the
    # F1b rescue win: outlier_rate ceiling (catches rescue silently turning off
    # → ~2% spiking back to ~28%), n_rescued floor, intent-purity floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            touched:
              - 'src/enrich/clustering.py'
              - 'src/enrich/sources/cowrie/commands.py'
              - 'config/default.yaml'
              - 'scripts/eval_command_scale.py'
              - 'eval/command-snapshot-v1.jsonl.gz'
              - 'eval/baseline-command-scale.json'
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        name: Install deps
        run: pip install -e .[cluster]
      - if: steps.filter.outputs.touched == 'true' || github.event_name == 'push'
        name: Run command-scale eval against snapshot + baseline
        # Reads eval/command-snapshot-v1.jsonl.gz (committed, refreshed via
        # scripts/refresh_command_snapshot.py) and clusters all commands
        # offline. Re-base via --write-baseline after an intentional change.
        run: |
          python scripts/eval_command_scale.py \
            --snapshot eval/command-snapshot-v1.jsonl.gz \
            --baseline eval/baseline-command-scale.json \
            --no-json
