[project]
name = "dshield_prism"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "elasticsearch==8.19.3",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# HDBSCAN clustering / novelty scoring
# Uses sklearn.cluster.HDBSCAN (added in scikit-learn 1.3) — no Cython build needed.
# scipy is pulled in by sklearn already; declared explicitly because the
# playbook-merge path imports `scipy.cluster.hierarchy` directly.
cluster = [
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
]

[project.scripts]
dshield_prism = "enrich.cli:main"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# pyflakes (F) catches real bugs and stays on. The deferred E7xx rules are
# cosmetic (multi-statement lines, ambiguous names, lambda assignment).
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Standalone smoke tests prepend the repo root to sys.path before importing.
"scripts/*" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enrich" = ["data/*.json"]
