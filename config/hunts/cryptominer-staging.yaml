id: cryptominer-staging
name: "Cryptominer staging signature"
description: |
  Sessions that touched `/proc/cpuinfo` AND were classified as
  non-recon intent. CPU detection followed by payload download /
  execution / a miner is the classic staging pattern — the actor is
  sizing up the host before deploying the binary.

  Recon-only `/proc/cpuinfo` reads are excluded (the corpus is
  dominated by scanners that touch cpuinfo as part of fingerprinting,
  not as part of staging).
filters:
  - kind: artifact_set_contains_any
    values:
      - "file:/proc/cpuinfo"
  - kind: intent_in
    values:
      - download_ingress
      - execute_payload
      - cryptomining

# Ships disabled: `enabled` gates whether this hunt writes findings.
# Preview it or switch it on from the console /hunts page.
enabled: true
