id: credential-spray
name: "High-volume credential spray"
description: |
  Sessions with ≥ 20 failed login attempts. The cowrie login-fail
  counter accumulates over the session, so this catches actors who
  burn through credential lists rather than the common single-try
  noise from internet-wide scanners.

  Threshold of 20 is conservative — credential-spray bots routinely
  fire 50-500+ pairs per session. Drop to `login_fail_count_gte: 10`
  to widen, raise to `>= 50` to catch only the loudest.
filters:
  - kind: login_fail_count_gte
    threshold: 20
