# Default config. Safe to commit. Per-deploy overrides go in config/local.yaml (or local.yml; gitignored).
# Final config = default.yaml deep-merged with local.yaml. Secrets (ES creds) live in .env.

elasticsearch:
  hosts: ["https://localhost:9200"]
  verify_certs: false
  ca_certs: null
  request_timeout: 60

  # Heap / circuit-breaker-aware backpressure. On a small ES node a heavy
  # aggregation / scan / bulk can trip the parent circuit breaker (HTTP 429
  # circuit_breaking_exception); the transport retries within milliseconds —
  # too fast for the breaker to drain — then fails the step. When enabled,
  # every ES call retries breaker rejections after polling the node's heap
  # and waiting for it to drain. max_wait_s is a shared wall-clock budget per
  # operation — the pipeline prefers waiting a long time over failing a step.
  backpressure:
    enabled: true
    heap_high_watermark: 0.85    # pause new work at/above this parent-breaker ratio
    heap_resume_watermark: 0.70  # resume below this (hysteresis)
    poll_interval_s: 2.0         # breaker re-probe cadence while paused
    max_wait_s: 3600.0           # overall patience budget per operation (~1h)
    retry_max_attempts: 200      # secondary ceiling; max_wait_s is the real limit
    retry_base_delay_s: 2.0      # exponential backoff base, clamped to remaining budget
    retry_max_delay_s: 30.0      # per-retry backoff cap

  # All index names are nested per source so adding a new sensor
  # (webhoneypot, dionaea, etc.) is a sibling block, not a flat rename.
  # Naming layout (post-2026-05-17): prism.<function>.<source>.<layer>
  # - prism.*    distinguishes project-owned indices from Fleet's logs-*
  # - <function> ∈ raw | enriched | rollup | clusters | campaigns
  #                | intel | findings  (intel/findings are cross-source)
  # - <source>   ∈ cowrie | <future-source>
  # - <layer>    ∈ session | command | ip | url | <future-layer>
  # The `prism.*` prefix isn't claimed by any Fleet integration, so these
  # indices survive integration upgrades that wipe `logs-*-*` streams.
  indexes:
    cowrie:
      sessions_raw:      "prism.raw.cowrie.session"
      commands:          "prism.enriched.cowrie.command"
      command_clusters:  "prism.cluster.cowrie.command"
      sessions_rollup:   "prism.rollup.cowrie.session"
      session_clusters:  "prism.cluster.cowrie.session"
      ips_rollup:        "prism.rollup.cowrie.ip"
      ip_clusters:       "prism.cluster.cowrie.ip"
      # Multi-session campaigns mined by `mine campaigns`. Distinct from
      # session_clusters (each centroid there is a "playbook"). See
      # docs/PLAYBOOKS_AND_CAMPAIGNS.md.
      campaigns:         "prism.campaign.cowrie"
      # Write-once playbook-identity anchors (ROADMAP #1): one doc per
      # stable_playbook_id pinning its first-mint centroid.
      playbook_anchors:  "prism.identity.cowrie.playbook_anchor"
    # DShield-firewall source (Phase I3). Raw per-connection events from the
    # sensor's localdshield.log (every IP that touched the sensor, not just the
    # SSH/telnet ports Cowrie emulates); firewall_ip is the per-source rollup.
    dshield:
      firewall:      "prism.raw.dshield.firewall"
      firewall_ip:   "prism.rollup.dshield.firewall_ip"

llm:
  # provider: "ollama" (Ollama API) or "openai_compat" (LM Studio, vLLM, llama.cpp server)
  provider: "ollama"
  # base_url MUST be overridden in local.yaml.
  generation_model: "qwen/qwen3-8b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5@q8_0"
  request_timeout: 600
  max_retries: 2
  api_key: null   # only needed for openai_compat servers that require auth
  # Fields prepended to the raw command before embedding (enrich-then-embed).
  # Empty list = embed raw command only. Changes to this list (and to
  # embedding_model above) flow into embed_config_hash automatically — no
  # manual version bump required. Run `reembed` after editing to refresh
  # the embeddings without re-running the LLM.
  embed_context:
    - intent
    - description
  # E8.1 — layout of the embed-input string. Three options:
  #   - "prelude_first" (default, unchanged from pre-E8.1 behavior):
  #       "{enrichment-context}\nCommand: {command}"
  #   - "command_first":
  #       "Command: {command}\n{enrichment-context}"
  #   - "command_only_with_tag":
  #       "[shell] {command}"  — prelude dropped entirely.
  # Folded into embed_config_hash automatically; a flip invalidates the
  # embed cache and reembed re-runs every command. See
  # eval/results/embed-input-order-sweep-*.md (E8.2) for sweep results.
  # First-deploy note: adding this field to the hash payload triggers
  # one full reembed cycle on the first run after E8.1 lands, even
  # though "prelude_first" produces byte-identical embeddings to the
  # pre-E8.1 layout. Expected and idempotent — the second reembed will
  # show `skipped_fresh: 4571` as the cache settles.
  embed_input_order: "prelude_first"

worker:
  state_db: "/var/lib/dshield_prism/state.sqlite"
  page_size: 1000
  command_max_chars: 4000
  initial_lookback_days: null
  log_level: "INFO"
  # Project log directory. CLI rotates `cli.log` here; setup.sh / destroy.sh
  # tee their stdout to setup.log / destroy.log. Empty string or an
  # unwritable path disables file logging (the stderr handler stays so
  # journalctl keeps working under systemd). Override per-run via the
  # PRISM_LOG_DIR env var.
  log_dir: "/var/log/dshield_prism"
  # When true, the cache key carries two auto-derived hashes:
  #   - llm_config_hash:   prompt-file content + LLM-side cooccurrence params
  #   - embed_config_hash: llm.embed_context + llm.embedding_model +
  #                        llm.embed_input_order +
  #                        cooccurrence.embed_cooccurrence toggle
  # Editing any of those then invalidates the appropriate cache side on
  # the next pipeline run. The embed-only side can be refreshed by
  # `reembed` without an LLM call. Flip to `false` to bypass and treat
  # all rows as fresh — useful when LLM budget is tight and a config
  # edit landed; bless or wipe the cache manually as needed.
  # ROADMAP issue #7.
  cache_auto_invalidate: true
  # CPU parallelism for the HDBSCAN clustering passes (cluster commands /
  # sessions / ips) — sklearn HDBSCAN's n_jobs. Parallelises the
  # nearest-neighbour / core-distance phase (the dominant cost of the O(n^2) IP
  # clustering at scale). -1 = all cores, 1 = single-core (legacy), N = cap.
  cluster_n_jobs: -1

# Cloud LLM escalation. Off by default; enable per-deploy in local.yaml.
cloud:
  enabled: false
  provider: "anthropic"
  base_url: null            # null = Anthropic public API
  model: "claude-sonnet-4-6"
  max_tokens: 1024
  request_timeout: 120
  daily_budget_usd: 5.0
  rpm_limit: 10
  triage:
    # Was 6 (modal local-confidence value, escalated 70% of corpus and burnt
    # daily_budget_usd before noon). Lowered to 4 so we escalate "actually
    # low confidence" not "model's default floor." See ROADMAP issue #4.
    confidence_max: 4           # enrich: escalate when local confidence <= this (1-10)
    escalate_confidence_max: 8  # escalate cmd: only re-triage novel docs with confidence <= this
    sample_rate: 0.01           # 1% random sampling for quality monitoring
    base64_min_run: 200         # length threshold for "suspicious base64 blob"
    # File extensions removed (`zip`, `exe`): they are far more common as
    # filename suffixes than as TLDs, and the host-context anchor on
    # `_TLD_RE` (src/enrich/triage.py) reduces false positives further. See
    # ROADMAP issue #4.
    suspicious_tlds:
      - xyz
      - top
      - tk
      - ml
      - ga
      - cf
      - gq
      - club
      - icu
      - buzz
      - monster
      - rest
      - bar
      - fit
      - online
      - site
      - stream
      - cam
    novel_embedding_threshold: 0.5  # escalate when novelty_score >= this
    novel_confidence_min: 4         # but only when local confidence is at least
                                    # this — gates out the encoding-artifact tail
                                    # (raw ELF bytes etc. that score novelty=1.0
                                    # with confidence=1). See ROADMAP issue #3.
    # M3.A: intel-aware escalation gate. When true, before dispatching
    # a triaged command to the cloud, consult the intel verdicts on
    # its source IPs. Skip cloud when:
    #  - all source IPs are `override_applied=authoritative_clean`
    #    (researchers like ShadowServer), OR
    #  - all source IPs have malicious_provider_count >= 2 AND every
    #    triage_reason is a gateable (LLM-uncertainty) reason — not
    #    a command-shape reason like base64_blob/ip_literal/rare_tld.
    # Disable to revert to non-intel-aware escalation.
    intel_aware: true
  pricing:
    # USD per 1M tokens. Update to match the model you point at.
    input_per_mtok: 3.0
    output_per_mtok: 15.0

# Per-command session-co-occurrence context. For each cache-miss command we
# query ES for the sessions that ran it, then pull the most-frequent OTHER
# commands those sessions ran. Top-K are passed to the LLM (and optionally
# appended to the embed input) so enrichment sees the command in context.
cooccurrence:
  enabled: true
  session_sample_size: 50          # max sessions sampled per command
  top_k: 8                         # co-occurring commands surfaced
  min_sessions: 3                  # skip when command has fewer sampled sessions
  # The old binary `max_corpus_session_ratio: 0.40` boilerplate cutoff was
  # replaced with continuous TF-IDF weighting (ROADMAP issue #6). Setting
  # the field here is a benign no-op — kept out of the default for clarity.
  # embed_cooccurrence flipped to false 2026-06-01 per E2.1 sweep
  # (eval/results/embed-input-sweep-20260601T144733Z.md): every
  # cooccurrence-enabled config in the sweep underperformed its
  # no-cooccurrence pair on ARI / completeness / homogeneity. Production
  # config without cooccurrence cleared the plan's E2 success metric
  # (ARI ≥ 0.36, completeness ≥ 0.60, homogeneity ≥ 0.80) while the
  # cooccurrence-enabled equivalent sat at the v1+v2 baseline floor.
  # `enabled: true` above is preserved — LLM-side enrichment still gets
  # the cooccurrence context block; only the embed-text append is dropped.
  embed_cooccurrence: false        # was true; see embed-input-sweep-20260601T144733Z.md

prompts:
  command_enrichment:        "config/prompts/command_enrichment.txt"
  command_deep_dive:         "config/prompts/command_deep_dive.txt"
  playbook_name:             "config/prompts/playbook_name.txt"
  # Pass-2 of `name playbooks`: re-prompts the LLM when multiple clusters
  # end up with the same pass-1 name, asking it to produce distinct
  # names that capture what makes each cluster substantively different.
  # Comment out to skip pass 2 (collisions keep their pass-1 names).
  # ROADMAP issue #10.
  playbook_disambiguate:     "config/prompts/playbook_disambiguate.txt"
  # Used by the console's /compare page (and the explain_cluster_pair CLI
  # script's --explain flag). Local LLM only.
  cluster_pair_explanation:  "config/prompts/cluster_pair_explanation.txt"

# HDBSCAN over command embeddings.
command_cluster:
  min_cluster_size: 5
  min_samples: 2
  page_size: 1000
  batch_size: 200
  # Weight of scalar feature block (occurrence_count, unique_source_ips, confidence,
  # session_reuse_rate) appended to the L2-normalized embedding matrix.
  # Semantic signal (1.0 norm) dominates; scalars break ties. Tune 0.0–0.15.
  scalar_weight: 0.05
  # Noise-rescue cosine threshold (F1b) — brings the command layer to parity
  # with the session layer, which already rescues. Outlier commands within
  # this pure-embedding cosine of a cluster centroid are reassigned to it
  # post-HDBSCAN. 0.0 disables. The F1 diagnostic found 91.7% of command
  # outliers sit within 0.94 of a centroid (median 0.993, 100% intent-match) —
  # HDBSCAN density noise, not novelty — so 0.94 cuts the command outlier rate
  # ~27.7% -> ~2.3%. Light scalar augmentation (0.05) keeps pure-embedding
  # rescue geometry-safe, same as sessions. See eval/results/F1-outlier-diagnostic.md.
  rescue_threshold: 0.94
  # Fit-only TruncatedSVD dim for the command HDBSCAN. 0 = off (full 768-d;
  # ~O(n^2), the command-layer scale wall). When >0, the embedding is reduced
  # to this many dims for cluster-label assignment ONLY — rescue / persisted
  # centroids / novelty / the cross-run reference stay full-dim, so nothing
  # downstream shifts (no reference rebuild, no novel_embedding retune). 128
  # (default) preserves — slightly improves — quality at ~6x speed; auto-skips
  # to full-dim on corpora smaller than this. 0 = off. Sweep your own corpus
  # (scripts/sweep_command_svd.py) if you change it.
  cluster_svd_dim: 128

# Session-level rollup + clustering + playbook naming.
session:
  assignment_tfidf_tau: float = 0.50
  # Bump when mean-pool inputs change to force full re-rollup.
  embed_version: "v1"
  # HDBSCAN params. min_cluster_size=5 picked by the brutal-review phase 3.2
  # sweep (scripts/sweep_hdbscan.py) — gives ARI 0.301 on the v1 labeled
  # eval set vs. 0.238 at mcs=3 (the previous default) and 0.262 at mcs=8.
  # The +0.063 lift comes from merging label-fragmented playbooks (notably
  # the chattr+RSA persistence playbook that was split across 12 cluster
  # docs at mcs=3) into fewer, more representative clusters. Outlier rate
  # rises from 16% to 24% as a side effect — sessions that were marginally
  # cluster-assigned at mcs=3 fall to HDBSCAN noise at mcs=5.
  cluster_min_cluster_size: 5
  # Item 72 / Finding 53: novel-pool-only tail minting may use a lower floor so
  # tight rare behaviours such as the 3-session scp_upload group can flow through
  # the normal cluster-doc -> naming -> write-once-anchor path. Normal session,
  # command and IP clustering still use their own default floors; singletons stay
  # out of scope.
  novel_pool_cluster_min_cluster_size: 3
  # min_samples=2 keeps HDBSCAN's mutual-reachability density smoothing on
  # (min_samples=1 disables it = single-linkage, which can let one mega-
  # cluster swallow the bulk on a heavy-duplicate corpus — ROADMAP issue
  # #5). The sweep showed ms=1 and ms=2 produce IDENTICAL clusterings at
  # mcs=5 on this corpus; keep ms=2 as the safer default.
  cluster_min_samples: 2
  # Weight of the scalar feature block in the session cluster matrix.
  # Scalars: command_count, unique_commands, login_success_rate, mean_novelty_score.
  cluster_scalar_weight: 0.05
  # Rollup pagination + parallelism (P-scale). page_size = sessions per batch
  # (also the events-fetch page and the bulk feed; helpers.bulk re-chunks writes
  # at 500). rollup_workers = worker threads over independent batches — the work
  # is round-trip-bound, so ~linear up to ES capacity. Push higher in local.yaml
  # if ES has the headroom; 1 = serial.
  page_size: 2000
  batch_size: 200
  rollup_workers: 5
  # Max unique commands sampled per playbook (session cluster) for LLM name generation.
  playbook_sample_commands: 15
  # ROADMAP #11 — naming accuracy. Max member sessions sampled per cluster
  # when computing cluster-wide command/IOC coverage for naming (random
  # subsample when larger). Bounds per-playbook aggregation cost.
  playbook_naming_session_cap: 500
  # ROADMAP #11 — merge-on-no-distinction. In pass-2 disambiguation a feature
  # (command or IOC) is "distinctive" to a colliding cluster when its session
  # coverage is >= this floor while every sibling's is below it. Two colliding
  # playbooks with no distinctive feature between them are merged rather than
  # given fabricated distinct names. Conservative low default — a separating
  # feature in >=25% of one cluster's sessions (absent in the other) blocks
  # the merge. Behavioral-feature merge below the embedding-geometry merge.
  # Raise to merge more aggressively; 1.0 effectively disables merging.
  playbook_merge_distinctiveness_floor: 0.25
  # Cosine-similarity threshold for merging HDBSCAN clusters into a single
  # playbook. Two clusters whose centroids are at least this similar (single-
  # linkage union-find) collapse into one playbook before LLM naming. Fixes
  # the failure mode where HDBSCAN splits a behaviourally-identical group
  # across two clusters (verified by `scripts/diagnose_centroid_similarity.py`).
  # 1.0 disables merging (1 cluster = 1 playbook). Complete-linkage merging
  # (every pair in a group must clear the threshold) already guards against
  # transitive mega-merges through borderline edges, so low values can't
  # chain unrelated centroids — but below ~0.93 distinct behaviours start
  # merging and homogeneity drops. 0.94 chosen per the F-phase merge sweep:
  # consolidates over-fragmented playbooks (uname-recon + ssh-key variants)
  # while homogeneity holds at 0.86 and density fragments are absorbed; 0.92
  # over-merges. See eval/results/F-spike-verdict.md.
  playbook_merge_threshold: 0.94
  # Anchor-identity match only — NOT the cluster merge above, which stays 0.94 on
  # the 2026-06-01 fragmentation sweep. 0.96 sits in an empty valley: the live
  # run's 13 group centroids score 0.9457, 0.9485, then nothing until 0.9629 and
  # a cluster at 1.0000. Only the two hair's-margin inheritances change, and both
  # then mint pure anchors (Finding 71D/E).
  playbook_anchor_match_threshold: 0.96
  # E4 (Finding 76) — mint-time predicate split. When a playbook group that REUSED an
  # existing anchor id splits cleanly into {fires no structural predicate} / {fires any},
  # with both sides at or above novel_pool_cluster_min_cluster_size, mint the minority as
  # its own anchor and re-pin the parent onto its retained members. The re-pin is a
  # deliberate, narrow exception to write-once anchor pinning (see
  # setup/es-mappings/cowrie/playbook_anchors.json) and is reversible via
  # `repinned_from_centroid`. Measured: 24 of 9,351 sessions move, all parent -> new,
  # novel rate unchanged, iot_cli_probe 0.000 -> 1.0000. OFF by default.
  mint_predicate_split: false
  # Option A assignment thresholds. Embedding cosine to the nearest anchor:
  # >= confident_tau assigns outright; [tau, confident_tau) is the band, confirmed
  # by the TF-IDF secondary signal >= tfidf_tau (else the anchor is treated as a
  # conflation and the cascade falls through to the next-nearest); < tau is novel.
  assignment_tau: 0.94
  assignment_confident_tau: 0.98
  # 0.50, not 0.80 (item 62). Measured corpus-wide, the band's TF-IDF cosines are
  # BIMODAL with an empty valley: 2,813 checks at 0.12-0.2 (genuinely dissimilar),
  # only 108 across the whole of 0.2-0.7, then 2,382 at 0.7-0.8 immediately below
  # 3,522 confirms at 0.8-1.0. The old 0.80 sliced a continuous 0.7-1.0 mass in
  # half, discarding its lower 2,382 as false conflations. Any value in ~0.25-0.65
  # behaves identically, so this is a VALLEY PLACEMENT, not a tuned figure — do not
  # nudge it without re-measuring the distribution via eval_novel_pool.py's
  # band_tfidf_diagnosis. Kept (rather than disabling the band) so the 2,813-check
  # low mode stays rejected. See docs/decisions.md.
  assignment_tfidf_tau: 0.50
  # Item 81 — explicit anchor-scoped band bypass. Listed anchor ids still need
  # `assignment_tau <= emb_cos < assignment_confident_tau`, but then assign by
  # embedding rather than the TF-IDF band check. Empty by default; do not use as a
  # substitute for a measured global `assignment_confident_tau` move.
  assignment_band_bypass_anchor_ids: [spb-0b4058711471410d]
  # ROADMAP #4 — cluster specificity. Max keys kept per centroid in each of
  # ip_specificity / command_specificity. Set well past realistic cluster
  # sizes so every member carries a score (drawer / graph can show commodity
  # pills, not missing ones). Safety valve against pathological clusters.
  specificity_store_cap: 10000
  # UI threshold for "distinctive" — pills / rings at or above render filled,
  # below render faded. 0.5 corresponds to `df ≤ √C`. Served to the console
  # via /api/config/ui; an analyst can override per-browser via the
  # `prism.spotlightThreshold` localStorage key.
  specificity_threshold: 0.5
  # Session-layer clustering mode (E4.4 adoption).
  # - "hdbscan" (default): production behaviour pre-2026-06-01; single
  #   HDBSCAN pass over embedding + weighted scalar block.
  # - "late_fusion": two HDBSCAN passes (one over embedding+scalars, one
  #   over a per-session TF-IDF + truncated-SVD lexical view of
  #   `command_stream_text`), fused via Agglomerative on the per-pair
  #   disagreement-distance matrix. +0.085 ARI vs hdbscan on the merged
  #   v1+v2 eval (eval/results/E4-verdict.md). Reversible by flipping
  #   back to "hdbscan" — every other code path is unchanged.
  # Outlier semantics are preserved in either mode: `cluster.is_outlier`
  # is sourced from the embedding-HDBSCAN pass, so novelty / rescue /
  # outlier_burst downstream behaviour does not change.
  # NOTE: late_fusion requires `command_stream_text` populated on the
  # session rollups. Newly-built rollups get it for free; older rollups
  # need a one-shot backfill via
  # `scripts/backfill_command_stream_text.py`.
  clustering_mode: "hdbscan"
  # Lexical-view dimensionality for the late_fusion path. 100-d is the
  # E0.2 ablation baseline that has carried through every subsequent
  # sweep. Ignored when `clustering_mode == "hdbscan"`.
  cluster_lexical_features_dim: 100
  # Scale-hardening P1.2 — windowed session clustering (D1 hybrid). The 6h
  # backward cycle re-clusters only sessions from the last N days instead of
  # the whole all-time rollup. 0 = all-time (legacy). Identity stays stable:
  # playbook ids re-match by centroid anchor, novelty scores against the frozen
  # reference_centroid set. The slower weekly full re-cluster
  # (`dshield_prism-recluster-full` timer: `cluster sessions --window-days 0
  # --refresh-reference`) refreshes the reference and re-pools the long tail.
  cluster_window_days: 30
  # Fit-only TruncatedSVD dim for the session HDBSCAN (mirrors
  # command_cluster.cluster_svd_dim). HDBSCAN on the 768-d session embedding is
  # ~O(n^2), so a full-corpus run (`--window-days 0`: `pipeline --backfill` and
  # the weekly recluster-full timer) fits at full dim and runs for HOURS at
  # hundreds-of-thousands scale. >0 reduces the embedding to this many dims for
  # cluster-label assignment ONLY — rescue / persisted centroids / novelty / the
  # cross-run reference stay full-dim, so nothing downstream shifts. 0 = off
  # (full-dim, legacy); auto-skips to full-dim below this corpus size. 96 is the
  # validated speed/quality balance (ARI 1.0 vs full across ~400 → 60k sessions);
  # 128 = more margin; 64 diverges past ~1k sessions so it's not a safe default.
  # Sweep your own corpus first to go lower (scripts/sweep_session_svd.py).
  cluster_svd_dim: 96

# IP-level rollup + clustering.
ip:
  embed_version: "v1"
  cluster_min_cluster_size: 3
  # See session.cluster_min_samples for rationale. ROADMAP issue #5.
  cluster_min_samples: 2
  # Noise rescue: reassign an HDBSCAN outlier to its nearest centroid when it is
  # within the Pth percentile of the intra-cluster spread, in the augmented
  # [embedding + scalars] euclidean space HDBSCAN fit on (NOT pure-embedding
  # cosine like command/session rescue_threshold — the IP geometry is
  # scalar-driven; see docs/decisions.md). 0 disables. 99 ≈ 92% of outliers
  # rescued, taking the IP outlier rate ~70% -> ~6% at ~94% playbook purity
  # (purity held flat p90->p99; see scripts/diagnose_ip_rescue.py).
  rescue_spread_percentile: 99
  # Weight on the BEHAVIOR sub-block (total_sessions, login_success_rate,
  # mean_novelty_score, mean_session_duration_s). Subdued because these
  # break ties on the embedding axis.
  cluster_scalar_weight: 0.05
  # Weight on the ATTRIBUTION sub-block (country one-hot, ASN bucket,
  # credential hash). Slightly hotter than behavior because these are
  # attribution signals, not noise — keeps two-bots-running-Mirai-from-
  # different-ASNs from clustering together. ROADMAP issue #8.
  cluster_attribution_weight: 0.10
  # Top-N ASNs each get a dedicated one-hot column in the ASN bucket;
  # all others share a pooled "other" column. Computed via a corpus-wide
  # ES terms agg at cluster time.
  attribution_top_asns: 50
  # Credential feature-hash dimension. Each unique (user:pass) the IP
  # tried is hashed into one of K bins; the column is that bin's share
  # of the IP's credential set (sum=1 per row).
  attribution_cred_hash_dim: 16
  # SSH client fingerprint (HASSH) sub-block. Low weight — SSH stack
  # diversity is small, so it's a weak corroborating attribution signal.
  # 0 disables. Feature-hash dim mirrors the credential hash.
  cluster_hassh_weight: 0.05
  attribution_hassh_hash_dim: 8
  # Phase K (ADOPTED) — behaviour-driven IP geometry. provenance=false drops
  # country + ASN + HASSH (queryable post-hoc, over-fragment the same behaviour
  # across hosting platforms); tier1 adds per-IP behaviour scalars; tier2 adds
  # the IP-as-bag-of-session-clusters block that re-separates the homogeneous
  # scanner population. See docs/handoff-ip-attribution-prune-plan.md (K5).
  # Set all three back to the historical geometry with provenance=true,
  # tier1=false, tier2=false.
  cluster_attribution_provenance_enabled: false
  cluster_tier1_enabled: true
  cluster_tier2_enabled: true
  cluster_tier2_svd_dim: 24
  # Rollup pagination + parallelism. rollup_workers parallelises the per-IP
  # session fetch (the IP rollup's dominant cost — one ES query per IP), so it
  # is the big lever at scale. 1 = serial.
  page_size: 2000
  batch_size: 1000
  rollup_workers: 5

# External threat-intel subsystem (ROADMAP "Research-mode strategic gaps" A).
# Runs alongside the enrichment pipeline; writes per-artifact intel docs to
# project-owned `prism.intel.*` indices. Disabled by default — flip
# `enabled: true` in local.yaml after configuring providers + never-query
# CIDRs. Milestone 1 ships three free-tier IP providers (Tor exit list,
# Spamhaus DNS, ISC daily feed); other artifact kinds + providers land in
# subsequent milestones.
intel:
  enabled: false

  # Project-owned intel indices, one per artifact kind. Pre-allocated so
  # adding a kind later doesn't require a config migration.
  indexes:
    ip:     "prism.intel.ip"
    url:    "prism.intel.url"
    domain: "prism.intel.domain"
    hash:   "prism.intel.hash"

  # Per-artifact-kind cache age-out for `intel refresh`, in DAYS. A refresh
  # skips re-querying any artifact whose intel doc was `last_refreshed` within
  # this many days, so a steady-state run only looks up new/aged-out artifacts
  # instead of re-hitting every provider for every known artifact each pass
  # (which also conserves the rate-limited VirusTotal budget). `0` = always
  # re-query that kind. `intel refresh --force` and `intel backfill` ignore
  # these. Tune by verdict volatility: a known-malware hash effectively never
  # changes, so a long TTL is safe; an IP's reputation can flip, so keep it
  # shorter.
  refresh_ttl_days:
    ip:     7
    url:    14
    domain: 14
    hash:   30

  providers:
    tor:
      enabled: true
      exit_list_url: "https://check.torproject.org/torbulkexitlist"
      refresh_minutes: 60
      cache_file: "/var/lib/dshield_prism/intel_tor_exits.txt"
    # abuse.ch FeodoTracker — active malware C2 IPs. HTTP-based bulk
    # download (no DNS-blocklist resolver gotchas). High precision;
    # the `_recommended` endpoint pre-filters to currently-active C2.
    feodotracker:
      enabled: true
      feed_url: "https://feodotracker.abuse.ch/downloads/ipblocklist_recommended.json"
      refresh_minutes: 60
      cache_file: "/var/lib/dshield_prism/intel_feodotracker.json"
    # FireHOL Level 1 — aggregated IP reputation across hundreds of
    # upstream feeds (CINS, DROP/EDROP, BinaryDefense, AlienVault,
    # EmergingThreats, …). The strictest tier — very low FP. Single
    # plain-text netset file with mixed IPs and CIDRs.
    firehol:
      enabled: true
      feed_url: "https://iplists.firehol.org/files/firehol_level1.netset"
      refresh_minutes: 360
      cache_file: "/var/lib/dshield_prism/intel_firehol_level1.netset"
    isc:
      enabled: true
      sources_url: "https://isc.sans.edu/api/sources/attacks/2000?json"
      refresh_minutes: 360
      cache_file: "/var/lib/dshield_prism/intel_isc_top.json"
    # GreyNoise Community — partitions internet-background-radiation
    # from targeted activity. The highest-value single integration for
    # research mode. Free tier is **50 lookups per week** (much tighter
    # than the "10k/month" headline suggests); the priority queue
    # spends the budget on highest-novelty artifacts first. The cache
    # TTL matches the weekly cycle — 7 days — so resolved artifacts
    # stay resolved and the budget always goes to fresh, high-novelty
    # IPs. Requires GREYNOISE_API_KEY in .env. Set enabled: false to
    # disable explicitly; otherwise the provider auto-skips when no
    # key is set.
    greynoise:
      enabled: true
      base_url: "https://api.greynoise.io"
      request_timeout_seconds: 8.0
      daily_budget: 6
      min_inter_call_seconds: 1.0
    # AbuseIPDB — abuse-confidence score + report count + ISP. Free
    # tier 1000 checks/day. Requires ABUSEIPDB_API_KEY in .env;
    # auto-skipped when unset.
    abuseipdb:
      enabled: true
      base_url: "https://api.abuseipdb.com"
      request_timeout_seconds: 8.0
      daily_budget: 900
      min_inter_call_seconds: 0.0
      max_age_days: 90
    # M4: URL providers (abuse.ch family — no key, unmetered).
    urlhaus:
      enabled: true
      feed_url: "https://urlhaus.abuse.ch/downloads/csv_online/"
      refresh_minutes: 60
      cache_file: "/var/lib/dshield_prism/intel_urlhaus.csv"
    threatfox:
      enabled: true
      base_url: "https://threatfox-api.abuse.ch/api/v1/"
      request_timeout_seconds: 8.0
      min_inter_call_seconds: 0.5
    # #2: hash-kind providers.
    malwarebazaar:
      enabled: true
      base_url: "https://mb-api.abuse.ch/api/v1/"
      request_timeout_seconds: 8.0
      min_inter_call_seconds: 0.5
    # VirusTotal public — scaffold, OFF by default. Needs VIRUSTOTAL_API_KEY
    # and enabled: true to run; free tier 4/min, 500/day.
    virustotal_public:
      enabled: false
      base_url: "https://www.virustotal.com/api/v3"
      request_timeout_seconds: 10.0
      daily_budget: 450
      min_inter_call_seconds: 16.0

  # Priority-queue weights. `priority = novelty_w * novelty +
  #                                     low_conf_w * (1 - confidence/10) +
  #                                     centrality_w * centrality_norm +
  #                                     recency_w * recency_decay`.
  # Local novelty dominates by design (per 2026-05-16 design decision):
  # scarce free-tier lookups go first to artifacts most likely to be
  # research discoveries.
  priority:
    novelty_w: 0.50
    low_conf_w: 0.20
    centrality_w: 0.15
    recency_w: 0.15
    recency_half_life_hours: 168.0

  # CIDRs that MUST NOT be queried against external feeds. RFC1918 +
  # loopback + link-local + multicast + reserved are already filtered
  # at the canonicaliser (src/enrich/intel/artifact.py); add the
  # operator's egress IP, the SO box's public IP, any peer research
  # sensors, and any user-controlled infrastructure here.
  never_query_cidrs: []

  # ES `size:` parameter for the discovery scans (IP rollup search,
  # threat.indicator nested terms agg). NOT an artifact-dispatch cap
  # — provider budgets are enforced at the provider level
  # (RateLimit.daily_budget). Unmetered bulk providers (Tor / ISC /
  # FireHOL / FeodoTracker / URLhaus) shouldn't be artificially
  # limited.
  max_per_run: 5000

ops:
  # Console "pipeline running" banner freshness window, in MINUTES. A
  # status=started ops doc shows as a live run until it's older than this; a
  # crashed verb (no finish patch) clears after the window. **Bumped to 48h
  # (2880) for the bulk-backfill phase** — a single `pipeline --backfill` writes
  # one started doc that stays open for hours, and the default 60 would make the
  # banner falsely clear mid-run. Revert to 60 for steady state (per-verb
  # systemd runs each finish in minutes, so a crashed one shouldn't ghost for
  # two days).
  pipeline_running_window_min: 2880
  # Console Health-badge cycle-freshness threshold, in MINUTES. Bounds how old
  # the newest finished `verb_run` may be before the badge's cycle dot flips to
  # `behind`. Distinct from `pipeline_running_window_min` (a live in-flight
  # verb): the backward cycle runs ~hourly, so 2h (120) with no run = the
  # schedule stalled. Read by the console's OpsConfig mirror.
  cycle_stale_min: 120

hunts:
  # Where the console's Hunts page reads/writes `*.yaml` hunt files (create,
  # edit, delete, toggle). Same pattern as `worker.state_db` above: an
  # absolute path under the systemd unit's `ReadWritePaths`
  # (`/var/lib/dshield_prism`), because the installed source tree at
  # `/opt/dshield_prism` is read-only (`ProtectSystem=strict`) and the Python
  # default (`config/hunts`, relative to cwd) would resolve inside it.
  # `setup/scripts/install.sh` creates this directory and seeds it from the
  # repo's shipped `config/hunts/*.yaml` on install. A workstation git
  # checkout needs the same `PRISM_LOCAL_CONFIG` override workaround
  # documented for `worker.state_db` in docs/operations.md if this path isn't
  # writable locally.
  config_dir: "/var/lib/dshield_prism/hunts"
